<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цифровая визитка</title>
<style>
:root{
  --bg:#f4f5f8; --surface:#ffffff; --text:#111318; --muted:#7b8090; --line:#e3e5ec;
  --ink:#111318; --ink-text:#ffffff; --accent:#2f5cff; --accent-text:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0e1015;--surface:#181b23;--text:#f1f2f6;--muted:#8d92a3;--line:#262a35;--ink:#f1f2f6;--ink-text:#0e1015;}
}
:root[data-theme="dark"]{--bg:#0e1015;--surface:#181b23;--text:#f1f2f6;--muted:#8d92a3;--line:#262a35;--ink:#f1f2f6;--ink-text:#0e1015;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:16px 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.lang{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.lang button{border:0;background:none;color:var(--muted);font:600 13px inherit;font-family:inherit;padding:6px 10px;border-radius:9px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--ink-text)}
.profile{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.avatar{width:92px;height:92px;border-radius:50%;background:var(--ink);color:var(--ink-text);display:grid;place-items:center;font-size:34px;font-weight:700;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:24px;line-height:1.15;margin:0 0 4px;letter-spacing:-.02em}
.role{color:var(--muted);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}.row:empty{display:none}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;border:0;font:600 16px inherit;font-family:inherit;text-decoration:none;cursor:pointer;color:var(--text)}
.btn:focus-visible,.lang button:focus-visible,.chip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.ink{background:var(--ink);color:var(--ink-text)}
.btn.pay{background:var(--accent);color:var(--accent-text)}
.btn.sq{flex:none;width:52px;padding:0}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--text);text-decoration:none;font-weight:500;font-size:15px}
.ico{width:20px;height:20px;border-radius:6px;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
section{margin-top:26px}
h2{font-size:20px;margin:0 0 12px;letter-spacing:-.01em}
dl{margin:0}
dt{color:var(--muted);font-size:13px;margin-top:14px}
dd{margin:2px 0 0;font-size:17px}
dd a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.site{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:12px 16px;border:1px solid var(--line);background:var(--surface);border-radius:14px;color:var(--text);text-decoration:none;font-size:16px}
.about{color:var(--muted);font-size:14px;margin-top:28px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--ink-text);padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none}
dialog{border:0;border-radius:20px;padding:20px;background:var(--surface);color:var(--text);max-width:320px;width:90%;text-align:center}
dialog::backdrop{background:rgba(0,0,0,.5)}
#qr{width:240px;height:240px;margin:0 auto 12px;display:block;background:#fff;border-radius:12px;padding:8px}
</style>
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Чёрный и золотой */
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
  --bg:#0a0a0a;--surface:#131210;--text:#f1ebdd;--muted:#948a73;--line:#2b2619;
  --gold:#c9a24b;--gold-hi:#e6c978;--gold-lo:#9c7a2e;--gold-dim:rgba(201,162,75,.38);
  --ink:#c9a24b;--ink-text:#0a0a0a;--accent:#c9a24b;--accent-text:#0a0a0a;color-scheme:dark;
}
html{background:#0a0a0a}
body{background:radial-gradient(120% 55% at 50% 0%,#1b1608 0%,#0a0a0a 60%) fixed;color:var(--text)}
.logo{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;font-size:17px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.lang{background:transparent;border:1px solid var(--gold-dim);border-radius:10px}
.lang button{color:var(--muted);border-radius:7px;letter-spacing:.06em}
.lang button[aria-pressed="true"]{background:var(--gold);color:#0a0a0a}
.profile{gap:18px;margin:6px 0 26px}
.avatar{border:2px solid var(--gold);box-shadow:0 0 0 4px #0a0a0a,0 0 0 5px var(--gold-dim),0 10px 30px rgba(0,0,0,.6);background:#1a1710;color:var(--gold)}
h1{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:700;font-size:30px;line-height:1.05;letter-spacing:.01em;color:var(--text)}
.role{color:var(--gold);text-transform:uppercase;letter-spacing:.24em;font-size:12px;font-weight:600;margin-top:8px;padding-top:8px;border-top:1px solid var(--gold-dim);display:inline-block}
.btn{border-radius:12px;font-weight:600;letter-spacing:.03em}
#save{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));color:#0a0a0a;box-shadow:0 6px 20px rgba(201,162,75,.18)}
#share,#close,#payClose{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));color:#0a0a0a}
#qrBtn{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn.pay{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.chip{background:var(--surface);border:1px solid var(--gold-dim);border-radius:12px;color:var(--text);letter-spacing:.02em}
.ico{background:var(--gold)!important;color:#0a0a0a!important;border-radius:5px}
section{margin-top:30px}
h2{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:700;font-size:15px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);padding-bottom:10px;border-bottom:1px solid var(--gold-dim);margin-bottom:4px}
dt{color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-size:11px;margin-top:16px}
dd{font-size:17px;color:var(--text)}
dd a{border-bottom:1px solid var(--gold-dim)}
.site{background:var(--surface);border:1px solid var(--gold-dim);border-radius:12px}
.about{color:var(--muted);text-align:center;font-size:13px;letter-spacing:.02em;padding-top:18px;border-top:1px solid var(--line)}
dialog{background:#121110;color:var(--text);border:1px solid var(--gold-dim);border-radius:16px}
dialog::backdrop{background:rgba(0,0,0,.72)}
.toast{background:var(--gold);color:#0a0a0a;font-weight:600}
.btn:focus-visible,.lang button:focus-visible,.chip:focus-visible{outline:2px solid var(--gold-hi)}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div class="logo" id="brand"></div>
    <div class="lang" role="group" aria-label="Язык">
      <button data-l="ru" aria-pressed="true">RU</button>
      <button data-l="en" aria-pressed="false">EN</button>
      <button data-l="tj" aria-pressed="false">TJ</button>
    </div>
  </header>

  <div class="profile">
    <div class="avatar" id="avatar"></div>
    <div><h1 id="name"></h1><div class="role" id="role"></div></div>
  </div>

  <div class="row">
    <button class="btn ink" id="save"></button>
    <button class="btn ink sq" id="qrBtn" aria-label="QR-код">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></svg>
    </button>
  </div>
  <div class="row" id="payRow"><button class="btn pay" id="pay"></button></div>
  <div class="row" id="socials"></div>

  <section>
    <h2 id="hContacts"></h2>
    <dl id="contacts"></dl>
  </section>

  <section id="workSec">
    <h2 id="hWork"></h2>
    <dl id="work"></dl>
    <a class="site" id="site" target="_blank" rel="noopener">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
      <span id="siteText"></span>
    </a>
  </section>

  <section>
    <button class="btn ink" id="share"></button>
  </section>
  <p class="about" id="about"></p>
</div>

<dialog id="dlg">
  <img id="qr" alt="QR">
  <div id="qrNote" style="color:var(--muted);font-size:14px;margin-bottom:12px"></div>
  <button class="btn ink" id="close" style="width:100%"></button>
</dialog>
<dialog id="payDlg">
  <div id="cardL" style="color:var(--muted);font-size:14px"></div>
  <div id="cardN" style="user-select:all;-webkit-user-select:all;font-size:22px;font-weight:700;letter-spacing:.06em;margin:8px 0 14px"></div>
  <div id="phoneL" style="color:var(--muted);font-size:14px"></div>
  <div id="phoneN" style="user-select:all;-webkit-user-select:all;font-size:20px;font-weight:600;margin:6px 0 14px"></div>
  <div id="nameL" style="color:var(--muted);font-size:14px"></div>
  <div id="nameN" style="font-size:20px;font-weight:600;margin:6px 0 18px"></div>
  <button class="btn pay" id="copyW" style="width:100%;margin-bottom:10px"></button>
  <button class="btn pay" id="copyP" style="width:100%;margin-bottom:10px"></button>
  <button class="btn ink" id="payClose" style="width:100%"></button>
</dialog>
<div class="toast" id="toast" role="status"></div>

const $ = id => document.getElementById(id);

function render(){

/* vCard */
$("save").onclick = () => {
  const d = CARD[lang], p = d.name.split(" ");
  const v = ["BEGIN:VCARD","VERSION:3.0",
    "N:"+(p.slice(1).join(" "))+";"+p[0]+";;;","FN:"+d.name,
    "ORG:"+d.company,"TITLE:"+d.role,
    "TEL;TYPE=CELL:"+CARD.phone,"TEL;TYPE=WORK:"+CARD.workPhone,
    "EMAIL;TYPE=WORK:"+CARD.email,"END:VCARD"].join("\r\n");
  const url = URL.createObjectURL(new Blob([v],{type:"text/vcard;charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = "contact.vcf";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast(T[lang].saved);
};

/* Share */
$("share").onclick = async () => {
  const link = location.href.split("#")[0];
  try { if (navigator.share) { await navigator.share({title:CARD[lang].name,url:link}); return; } } catch(e){ return; }
  try { await navigator.clipboard.writeText(link); toast(T[lang].copied); } catch(e){ toast(link); }
};

  if (window.qrcode) {

    $("qr").src = q.createDataURL(6,0);
  }
  $("dlg").showModal();
};

async function copyText(t){
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch(e) {}
  try {
    const a = document.createElement("textarea"); a.value = t; a.setAttribute("readonly","");
    a.style.cssText = "position:fixed;top:0;left:0;opacity:0;font-size:16px";
    $("payDlg").appendChild(a); a.focus(); a.select(); a.setSelectionRange(0, t.length);
    const ok = document.execCommand("copy"); a.remove(); return ok;
  } catch(e) { return false; }
}
function copyBtn(id, getVal, label) {
  $(id).onclick = async () => {
    const ok = await copyText(getVal());
    $(id).textContent = ok ? T[lang].copied : T[lang].fail;
    setTimeout(() => { $(id).textContent = T[lang][label]; }, 2200);
  };
}
